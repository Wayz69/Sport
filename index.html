<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MW Training</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1c1e22;
  --surface: #25272c;
  --surface2: #2e3035;
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --text: #f0ede8;
  --muted: #7a7774;
  --muted2: #a8a4a0;
  --accent: #e8c547;
  --run: #4fc3a1;
  --swim: #5b9bd5;
  --muscu: #e06c4a;
  --cardio: #9b79d4;
  --velo: #7ab8a0;
  --mobilite: #b0a090;
  --race: #e8c547;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.2rem 2rem;
  border-bottom: 1px solid var(--border);
  background: rgba(28,30,34,0.97);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 0.12em;
}
.logo span { color: var(--accent); }

.week-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted2);
}

.stats-bar {
  display: flex;
  border-top: 1px solid var(--border);
  padding: 0 2rem;
  overflow-x: auto;
  margin-top: 1rem;
}

.stat-item {
  padding: 0.9rem 1.8rem;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}
.stat-item:first-child { padding-left: 0; }

.stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.06em;
  color: var(--accent);
  line-height: 1;
}

.stat-lbl {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-top: 3px;
}

.legend-bar {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  padding: 0.8rem 2rem;
  border-top: 1px solid var(--border);
  padding-bottom: 2rem;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.65rem;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.calendar {
  padding: 1.5rem 2rem;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day-col { display: flex; flex-direction: column; gap: 8px; }

.day-head {
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 2px;
}

.day-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  color: var(--muted2);
}

.day-date {
  font-size: 0.7rem;
  color: var(--muted);
  margin-top: 2px;
}

.day-col.is-today .day-name { color: var(--accent); }
.day-col.is-today .day-head { border-bottom-color: var(--accent); }
.day-col.is-race .day-head { border-bottom-color: var(--race); }

.session {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--c, var(--muted));
  border-radius: 0 5px 5px 0;
  padding: 0.8rem 0.9rem;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(4px); }
  to   { opacity:1; transform:translateY(0); }
}

.session-type {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--c, var(--muted));
  margin-bottom: 0.3rem;
  font-weight: 500;
}

.session-title {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 0.35rem;
}

.session-detail {
  font-size: 0.75rem;
  color: var(--muted2);
  line-height: 1.6;
}

.session-meta {
  display: flex;
  gap: 6px;
  margin-top: 0.45rem;
  flex-wrap: wrap;
}

.session-tag {
  font-size: 0.68rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 6px;
  color: var(--muted2);
}

.race-slot {
  background: rgba(232,197,71,0.08);
  border: 1px solid rgba(232,197,71,0.25);
  border-radius: 5px;
  padding: 1.5rem 0.8rem;
  text-align: center;
}

.race-slot .race-icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
.race-slot .race-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: 0.3rem;
}
.race-slot .race-info {
  font-size: 0.68rem;
  color: var(--accent);
  opacity: 0.7;
  line-height: 1.7;
}

.empty-day {
  border: 1px dashed var(--border);
  border-radius: 5px;
  padding: 2rem 0.8rem;
  text-align: center;
  font-size: 0.65rem;
  color: var(--muted);
  opacity: 0.3;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

@media (max-width: 900px) {
  .calendar { grid-template-columns: repeat(4,1fr); }
}
@media (max-width: 600px) {
  .calendar { grid-template-columns: 1fr; padding: 1rem; }
  .topbar { padding: 1rem; }
}

.session.muscu { cursor: pointer; }

.session.muscu .expand-hint {
  font-size: 0.6rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 0.4rem;
  display: flex;
  align-items: center;
  gap: 4px;
}

.session.muscu .expand-hint::after {
  content: '▾';
  transition: transform 0.2s;
}

.session.muscu.open .expand-hint::after {
  transform: rotate(180deg);
}

.exercises-list {
  display: none;
  margin-top: 0.6rem;
  border-top: 1px solid var(--border);
  padding-top: 0.6rem;
  flex-direction: column;
  gap: 0.7rem;
}

.session.muscu.open .exercises-list {
  display: flex;
}

.exercise-name {
  font-size: 0.78rem;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 2px;
}

.exercise-muscles {
  font-size: 0.65rem;
  color: var(--muscu);
  margin-bottom: 3px;
}

.exercise-tip {
  font-size: 0.65rem;
  color: var(--muted2);
  line-height: 1.5;
  font-style: italic;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">MW <span>Training</span></div>
  <div class="week-label" id="weekLabel"></div>
</div>


<div class="calendar" id="calendar"></div>

<div class="stats-bar" id="statsBar"></div>

<div class="legend-bar">
  <div class="legend-item"><div class="legend-dot" style="background:var(--run)"></div>Course</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--swim)"></div>Natation</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--muscu)"></div>Muscu</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--cardio)"></div>Cardio</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--velo)"></div>Vélo</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--mobilite)"></div>Mobilité</div>
</div>

<script>
const TYPE_COLORS = {
  run:'var(--run)', swim:'var(--swim)', muscu:'var(--muscu)',
  cardio:'var(--cardio)', velo:'var(--velo)', mobilite:'var(--mobilite)',
  race:'var(--race)', other:'var(--muted2)'
};

const TYPE_LABELS = {
  run:'Course', swim:'Natation', muscu:'Muscu', cardio:'Cardio',
  velo:'Vélo', mobilite:'Mobilité', race:'Compétition', other:'Autre'
};

const DAY_NAMES = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

// ── PLAN DE LA SEMAINE ──────────────────────────────────────────
// Modifier ici chaque semaine
const WEEK_START = "2026-06-08";

const PLAN = [
  // LUNDI
  [
    { type:"muscu", title:"Force haut du corps + bas lourd", detail:"4x6 lourd - 3x12 bas du corps", duration:"1h00", exercises: [
      { name:"Bench Press", sets:"4x6", muscles:"Pectoraux - Triceps - Deltoïdes antérieurs", tip:"Omoplates serrées, pieds au sol, barre descend jusqu'à la poitrine, pousse vers le plafond." },
      { name:"Rowing Barre", sets:"4x6", muscles:"Grand dorsal - Rhomboïdes - Biceps", tip:"Dos plat, buste penché 45°, tire la barre vers le nombril, coudes près du corps." },
      { name:"Overhead Press", sets:"4x6", muscles:"Deltoïdes - Trapèzes - Triceps", tip:"Gainage serré, barre part du menton, pousse à la verticale, tête passe devant à la fin." },
      { name:"Squat", sets:"4x6", muscles:"Quadriceps - Fessiers - Ischio-jambiers", tip:"Pieds à largeur d'épaules, descend jusqu'à parallèle, genoux dans l'axe des orteils, dos droit." },
      { name:"Romanian Deadlift", sets:"3x10", muscles:"Ischio-jambiers - Fessiers - Bas du dos", tip:"Barre glisse le long des jambes, pousse les hanches en arrière, dos plat." },
      { name:"Élévation mollets", sets:"4x15", muscles:"Mollets - Soléaire", tip:"Amplitude complète, monte sur la pointe, descend lentement sous le talon." }
    ]},
    { type:"swim", title:"Pyramide", detail:"400m échauff + 100m - 200m - 300m - 400m - 300m - 200m - 100m (récup 20sec entre chaque) + 200m cool", duration:"55min", volume:"~2500m" },
    { type:"mobilite", title:"Mobilité hanches & tibias", detail:"Rotations hanches - Leg swings - Mobilité cheville - Étirements tibias doux", duration:"15min" }
  ],
  // MARDI
  [
    { type:"run", title:"Run progression", detail:"5min marche + 6x(6min RPE 4-5 / 30sec marche) + 5min marche", duration:"55min", volume:"~9km" },
    { type:"cardio", title:"Circuit Hyrox A", detail:"4 tours - SkiErg 250m + 20 Wall balls + 20m Farmers carry + 10 Burpee broad jump - Récup 2min entre tours", duration:"45min" },
    { type:"mobilite", title:"Mobilité épaules", detail:"Rotations épaules - Thoracique - Étirements pectoraux", duration:"15min" }
  ],
  // MERCREDI
  [
    { type:"muscu", title:"Force tirage + accessoires", detail:"4x6 tirage - 3x12 accessoires", duration:"1h00", exercises: [
      { name:"Pull-ups", sets:"4x6", muscles:"Grand dorsal - Biceps - Rhomboïdes", tip:"Prise pronation, part de l'extension complète, menton au-dessus de la barre, descend lentement." },
      { name:"Dips", sets:"4x6", muscles:"Triceps - Pectoraux inférieurs - Deltoïdes", tip:"Corps légèrement penché avant, descend jusqu'à 90° coudes, pousse sans verrouiller." },
      { name:"Curl Biceps Barre", sets:"4x8", muscles:"Biceps - Brachial", tip:"Coudes fixes contre le corps, monte lentement, descend sur 3 secondes." },
      { name:"Extension Triceps Poulie", sets:"4x8", muscles:"Triceps long - Triceps latéral", tip:"Coudes fixes, extension complète, contrôle la descente." },
      { name:"Leg Press", sets:"3x12", muscles:"Quadriceps - Fessiers", tip:"Pieds à largeur d'épaules, descend jusqu'à 90°, ne verrouille pas les genoux." },
      { name:"Élévation mollets machine", sets:"4x15", muscles:"Mollets - Soléaire", tip:"Amplitude complète, descend lentement pour étirer le mollet." }
    ]},
    { type:"swim", title:"Seuil", detail:"300m échauff + 3x400m en 5min45 départ 7min + 200m pull récup + 4x100m en 1min25 départ 1min50 + 200m cool", duration:"55min", volume:"~2500m" }
  ],
  // JEUDI
  [
    { type:"run", title:"Run progression", detail:"5min marche + 6x(6min RPE 4-5 / 30sec marche) + 5min marche", duration:"55min", volume:"~9km" },
    { type:"cardio", title:"Circuit Hyrox B", detail:"4 tours - Rameur 250m + Sled push 20m + Sled pull 20m + 20 Sandbag lunges - Récup 2min entre tours", duration:"45min" },
    { type:"mobilite", title:"Mobilité full body", detail:"GOWOD ou yoga flow - Accent bas du corps et hanches", duration:"20min" }
  ],
  // VENDREDI
  [
    { type:"velo", title:"Vélo endurance Z2", detail:"Foncier Z2 - FC 138-154bpm - Cadence 85-90rpm", duration:"1h30", volume:"~45km" },
    { type:"swim", title:"Technique dissociée", detail:"300m échauff + 8x50m (25m bras droit / 25m bras gauche) + 6x150m en 2min15 départ 3min (focus roulis) + 4x100m pull en 1min35 départ 2min + 200m cool", duration:"55min", volume:"~2400m" }
  ],
  // SAMEDI
  [
    { type:"muscu", title:"Hyrox force endurance", detail:"Focus charges Hyrox", duration:"1h00", exercises: [
      { name:"Deadlift", sets:"4x5", muscles:"Ischio-jambiers - Fessiers - Bas du dos - Trapèzes", tip:"Barre au-dessus des lacets, dos plat, pousse le sol, barre glisse contre les jambes, verrouille les hanches en haut." },
      { name:"Hip Thrust", sets:"4x10", muscles:"Fessiers - Ischio-jambiers", tip:"Épaules sur le banc, barre sur les hanches, monte le bassin à l'horizontale, serre les fessiers en haut." },
      { name:"Wall Balls lourd", sets:"4x15", muscles:"Fessiers - Quadriceps - Épaules", tip:"Squat complet, explose vers le haut, lance le ballon à 3m, attrape en fléchissant les genoux." },
      { name:"Farmers Carry lourd", sets:"4x40m", muscles:"Trapèzes - Core - Avant-bras - Fessiers", tip:"Charges lourdes, dos droit, pas courts et rapides, regard devant." },
      { name:"Élévation mollets", sets:"4x15", muscles:"Mollets - Soléaire", tip:"Amplitude complète, descend lentement sous le talon." }
    ]},
    { type:"run", title:"Run progression", detail:"5min marche + 6x(6min RPE 4-5 / 30sec marche) + 5min marche", duration:"55min", volume:"~9km" }
  ],
  // DIMANCHE
  [
    { type:"velo", title:"Vélo récup active", detail:"Foncier très cool - FC moins de 130bpm", duration:"45min" },
    { type:"swim", title:"Récup", detail:"400m échauff + 6x(100m pull / 100m dos) départ 3min30 + 200m cool", duration:"45min", volume:"~1700m" },
    { type:"mobilite", title:"Mobilité récup", detail:"Étirements globaux - Foam roller jambes - Focus tibias et mollets", duration:"20min" }
  ]
];

const RACES = {};



// ────────────────────────────────────────────────────────────────

function parseDurationToMin(str) {
  if (!str) return 0;
  let t = 0;
  const h = str.match(/(\d+\.?\d*)\s*h/); if (h) t += parseFloat(h[1]) * 60;
  const m = str.match(/(\d+\.?\d*)\s*min/); if (m) t += parseFloat(m[1]);
  return t;
}

function fmtTime(m) {
  if (!m) return '—';
  return m >= 60
    ? Math.floor(m/60) + 'h' + (m%60 > 0 ? String(Math.round(m%60)).padStart(2,'0') : '')
    : Math.round(m) + 'min';
}

function formatDate(d) {
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}

function render() {
  const monday = new Date(WEEK_START + 'T00:00:00');
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);

  document.getElementById('weekLabel').textContent =
    formatDate(monday) + ' — ' + formatDate(sunday);

  const today = new Date(); today.setHours(0,0,0,0);

  // Stats
  let totalMin=0, runKm=0, swimKm=0, veloMin=0, cardioMin=0, muscu=0, runMin=0, swimMin=0, total=0;
  PLAN.forEach(day => day.forEach(s => {
    total++;
    const min = parseDurationToMin(s.duration);
    const vol = s.volume || '';
    const km = parseFloat(vol);
    totalMin += min;
    if (s.type==='run')    { runMin+=min; if(vol.includes('km')) runKm+=km; }
    if (s.type==='swim')   { swimMin+=min; if(vol.includes('km')) swimKm+=km; else if(vol.includes('m')) swimKm+=km/1000; }
    if (s.type==='velo')   veloMin+=min;
    if (s.type==='cardio') cardioMin+=min;
    if (s.type==='muscu')  muscu++;
  }));

  const bar = document.getElementById('statsBar');
  bar.innerHTML =
    '<div class="stat-item"><div class="stat-val">'+total+'</div><div class="stat-lbl">Séances</div></div>'+
    '<div class="stat-item"><div class="stat-val">'+fmtTime(totalMin)+'</div><div class="stat-lbl">Temps total</div></div>'+
    (runKm>0 ? '<div class="stat-item"><div class="stat-val">'+runKm.toFixed(1)+'km</div><div class="stat-lbl">Course · '+fmtTime(runMin)+'</div></div>' : '')+
    (swimKm>0 ? '<div class="stat-item"><div class="stat-val">'+swimKm.toFixed(1)+'km</div><div class="stat-lbl">Nage · '+fmtTime(swimMin)+'</div></div>' : '')+
    (veloMin>0 ? '<div class="stat-item"><div class="stat-val">'+fmtTime(veloMin)+'</div><div class="stat-lbl">Vélo</div></div>' : '')+
    (cardioMin>0 ? '<div class="stat-item"><div class="stat-val">'+fmtTime(cardioMin)+'</div><div class="stat-lbl">Cardio</div></div>' : '')+
    (muscu>0 ? '<div class="stat-item"><div class="stat-val">'+muscu+'</div><div class="stat-lbl">Séances muscu</div></div>' : '');

  // Calendar
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  DAY_NAMES.forEach((name, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const isToday = d.getTime() === today.getTime();
    const race = RACES[i];
    const sessions = PLAN[i] || [];

    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' is-today' : '') + (race ? ' is-race' : '');

    col.innerHTML = '<div class="day-head"><div class="day-name">'+name+'</div><div class="day-date">'+formatDate(d)+'</div></div>';

    if (race) {
      col.innerHTML += '<div class="race-slot"><div class="race-icon">🏁</div><div class="race-name">'+race.name+'</div><div class="race-info">'+race.info.replace(/\n/g,'<br>')+'</div></div>';
    }

    if (sessions.length === 0 && !race) {
      col.innerHTML += '<div class="empty-day">Repos</div>';
    }

    sessions.forEach(s => {
      const color = TYPE_COLORS[s.type] || 'var(--muted2)';
      const label = TYPE_LABELS[s.type] || s.type;
      const isMuscu = s.type === 'muscu';

      let exercisesHtml = '';
      if (isMuscu && s.exercises) {
        exercisesHtml = '<div class="exercises-list">';
        s.exercises.forEach(ex => {
          exercisesHtml +=
            '<div class="exercise-item">'+
              '<div class="exercise-name">'+ex.name+' <span style="font-weight:300;color:var(--muted2)">— '+ex.sets+'</span></div>'+
              '<div class="exercise-muscles">'+ex.muscles+'</div>'+
              '<div class="exercise-tip">'+ex.tip+'</div>'+
            '</div>';
        });
        exercisesHtml += '</div>';
      }

      const div = document.createElement('div');
      div.className = 'session' + (isMuscu ? ' muscu' : '');
      div.style.setProperty('--c', color);
      div.innerHTML =
        '<div class="session-type">'+label+'</div>'+
        '<div class="session-title">'+s.title+'</div>'+
        (s.detail ? '<div class="session-detail">'+s.detail.replace(/\n/g,'<br>').replace(/ \+ /g,'<br>')+'</div>' : '')+
        '<div class="session-meta">'+
          (s.duration ? '<span class="session-tag">⏱ '+s.duration+'</span>' : '')+
          (s.volume   ? '<span class="session-tag">📏 '+s.volume+'</span>' : '')+
        '</div>'+
        (isMuscu && s.exercises ? '<div class="expand-hint">Voir les exercices</div>'+exercisesHtml : '');

      if (isMuscu && s.exercises) {
        div.addEventListener('click', () => div.classList.toggle('open'));
      }

      col.appendChild(div);
    });

    cal.appendChild(col);
  });
}

render();
</script>
</body>
</html>
