<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MW Training</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #1c1e22;
  --surface: #25272c;
  --surface2: #2e3035;
  --border: rgba(255,255,255,0.10);
  --border2: rgba(255,255,255,0.18);
  --text: #f0ede8;
  --muted: #7a7774;
  --muted2: #a8a4a0;
  --accent: #e8c547;
  --run: #4fc3a1;
  --swim: #5b9bd5;
  --muscu: #e06c4a;
  --cardio: #9b79d4;
  --velo: #7ab8a0;
  --mobilite: #b0a090;
  --race: #e8c547;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.2rem 2rem;
  border-bottom: 1px solid var(--border);
  background: rgba(28,30,34,0.97);
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 0.12em;
}
.logo span { color: var(--accent); }

.week-label {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted2);
}

.stats-bar {
  display: flex;
  border-top: 1px solid var(--border);
  padding: 0 2rem;
  overflow-x: auto;
  margin-top: 1rem;
}

.stat-item {
  padding: 0.9rem 1.8rem;
  border-right: 1px solid var(--border);
  flex-shrink: 0;
}
.stat-item:first-child { padding-left: 0; }

.stat-val {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.06em;
  color: var(--accent);
  line-height: 1;
}

.stat-lbl {
  font-size: 0.62rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-top: 3px;
}

.legend-bar {
  display: flex;
  gap: 1.2rem;
  flex-wrap: wrap;
  padding: 0.8rem 2rem;
  border-top: 1px solid var(--border);
  padding-bottom: 2rem;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.65rem;
  color: var(--muted2);
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}

.calendar {
  padding: 1.5rem 2rem;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
}

.day-col { display: flex; flex-direction: column; gap: 8px; }

.day-head {
  padding: 0.5rem 0;
  border-bottom: 2px solid var(--border);
  margin-bottom: 2px;
}

.day-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 0.08em;
  color: var(--muted2);
}

.day-date {
  font-size: 0.7rem;
  color: var(--muted);
  margin-top: 2px;
}

.day-col.is-today .day-name { color: var(--accent); }
.day-col.is-today .day-head { border-bottom-color: var(--accent); }
.day-col.is-race .day-head { border-bottom-color: var(--race); }

.session {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--c, var(--muted));
  border-radius: 0 5px 5px 0;
  padding: 0.8rem 0.9rem;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(4px); }
  to   { opacity:1; transform:translateY(0); }
}

.session-type {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--c, var(--muted));
  margin-bottom: 0.3rem;
  font-weight: 500;
}

.session-title {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
  margin-bottom: 0.35rem;
}

.session-detail {
  font-size: 0.75rem;
  color: var(--muted2);
  line-height: 1.6;
}

.session-meta {
  display: flex;
  gap: 6px;
  margin-top: 0.45rem;
  flex-wrap: wrap;
}

.session-tag {
  font-size: 0.68rem;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 2px 6px;
  color: var(--muted2);
}

.race-slot {
  background: rgba(232,197,71,0.08);
  border: 1px solid rgba(232,197,71,0.25);
  border-radius: 5px;
  padding: 1.5rem 0.8rem;
  text-align: center;
}

.race-slot .race-icon { font-size: 1.5rem; margin-bottom: 0.4rem; }
.race-slot .race-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  color: var(--accent);
  letter-spacing: 0.06em;
  margin-bottom: 0.3rem;
}
.race-slot .race-info {
  font-size: 0.68rem;
  color: var(--accent);
  opacity: 0.7;
  line-height: 1.7;
}

.empty-day {
  border: 1px dashed var(--border);
  border-radius: 5px;
  padding: 2rem 0.8rem;
  text-align: center;
  font-size: 0.65rem;
  color: var(--muted);
  opacity: 0.3;
  text-transform: uppercase;
  letter-spacing: 0.1em;
}

@media (max-width: 900px) {
  .calendar { grid-template-columns: repeat(4,1fr); }
}
@media (max-width: 600px) {
  .calendar { grid-template-columns: 1fr; padding: 1rem; }
  .topbar { padding: 1rem; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">MW <span>Training</span></div>
  <div class="week-label" id="weekLabel"></div>
</div>


<div class="calendar" id="calendar"></div>

<div class="stats-bar" id="statsBar"></div>

<div class="legend-bar">
  <div class="legend-item"><div class="legend-dot" style="background:var(--run)"></div>Course</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--swim)"></div>Natation</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--muscu)"></div>Muscu</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--cardio)"></div>Cardio</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--velo)"></div>Vélo</div>
  <div class="legend-item"><div class="legend-dot" style="background:var(--mobilite)"></div>Mobilité</div>
</div>

<script>
const TYPE_COLORS = {
  run:'var(--run)', swim:'var(--swim)', muscu:'var(--muscu)',
  cardio:'var(--cardio)', velo:'var(--velo)', mobilite:'var(--mobilite)',
  race:'var(--race)', other:'var(--muted2)'
};

const TYPE_LABELS = {
  run:'Course', swim:'Natation', muscu:'Muscu', cardio:'Cardio',
  velo:'Vélo', mobilite:'Mobilité', race:'Compétition', other:'Autre'
};

const DAY_NAMES = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];

// ── PLAN DE LA SEMAINE ──────────────────────────────────────────
// Modifier ici chaque semaine
const WEEK_START = '2026-06-01'; // Lundi de la semaine

const PLAN = [
  // LUNDI
  [
    { type:'muscu', title:'Force + bas du corps léger', detail:'Bench press · Rowing barre · OHP 4×6\nHip thrust 3×12 · Leg press 3×12', duration:'1h00' },
    { type:'swim',  title:'Endurance force', detail:"400m échauff + 4×(200m pull + 200m plaques) départ 4' + 200m cool", duration:'45min', volume:'~2000m' },
    { type:'mobilite', title:'Mobilité hanches & tibias', detail:'Rotations hanches · Leg swings · Mobilité cheville · Étirements tibias doux', duration:'15min' }
  ],
  // MARDI
  [
    { type:'run',   title:"Run Spé Mat'", detail:"5' marche + 8×(4' RPE 4-5 / 30\" marche) + 5' marche", duration:'45min', volume:'~7.5km' },
    { type:'cardio',title:'SkiErg intervalles', detail:'5×4min allure soutenue / 2min récup', duration:'40min' },
    { type:'mobilite', title:'Mobilité épaules', detail:'Rotations épaules · Thoracique · Étirements pectoraux', duration:'20min' }
  ],
  // MERCREDI
  [
    { type:'swim',  title:'Vitesse', detail:"300m échauff + 3×100m BN + 6×50m sprint départ 1'30\" + 8×100m en 1'30\" départ 2' + 200m cool", duration:'50min', volume:'~2500m' },
    { type:'velo',  title:'Vélo récup', detail:'Foncier très cool <130W', duration:'30min' }
  ],
  // JEUDI
  [
    { type:'run',   title:"Run Spé Mat'", detail:"5' marche + 8×(4' RPE 4-5 / 30\" marche) + 5' marche", duration:'45min', volume:'~7.5km' },
    { type:'muscu', title:'Force haut + bas léger', detail:'Pull-ups · Dips · Curl · Triceps\nIschio machine 3×12 · Leg press 3×12', duration:'1h00' },
    { type:'cardio',title:'Rameur', detail:'3×2000m / récup 3min', duration:'45min' }
  ],
  // VENDREDI — Puy du Fou
  [
    { type:'mobilite', title:'Mobilité full body', detail:'Yoga flow léger · Étirements globaux · Idéal après une journée de marche', duration:'20min' }
  ],
  // SAMEDI — Repos
  [
    { type:'mobilite', title:'Activation pré-course', detail:'Rotations hanches · Leg swings · 5min footing léger · 4× accélérations progressives', duration:'20min' }
  ],
  // DIMANCHE — Race
  []
];

// Compétitions sur certains jours (index 0=lundi ... 6=dimanche)
const RACES = {
  6: { name:'10K Adidas', info:'Objectif 45–47 min\nÉchauff 10min + accélérations' }
};

// ────────────────────────────────────────────────────────────────

function parseDurationToMin(str) {
  if (!str) return 0;
  let t = 0;
  const h = str.match(/(\d+\.?\d*)\s*h/); if (h) t += parseFloat(h[1]) * 60;
  const m = str.match(/(\d+\.?\d*)\s*min/); if (m) t += parseFloat(m[1]);
  return t;
}

function fmtTime(m) {
  if (!m) return '—';
  return m >= 60
    ? Math.floor(m/60) + 'h' + (m%60 > 0 ? String(Math.round(m%60)).padStart(2,'0') : '')
    : Math.round(m) + 'min';
}

function formatDate(d) {
  return d.toLocaleDateString('fr-FR', { day:'numeric', month:'short' });
}

function render() {
  const monday = new Date(WEEK_START + 'T00:00:00');
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);

  document.getElementById('weekLabel').textContent =
    formatDate(monday) + ' — ' + formatDate(sunday);

  const today = new Date(); today.setHours(0,0,0,0);

  // Stats
  let totalMin=0, runKm=0, swimKm=0, veloMin=0, cardioMin=0, muscu=0, runMin=0, swimMin=0, total=0;
  PLAN.forEach(day => day.forEach(s => {
    total++;
    const min = parseDurationToMin(s.duration);
    const vol = s.volume || '';
    const km = parseFloat(vol);
    totalMin += min;
    if (s.type==='run')    { runMin+=min; if(vol.includes('km')) runKm+=km; }
    if (s.type==='swim')   { swimMin+=min; if(vol.includes('km')) swimKm+=km; else if(vol.includes('m')) swimKm+=km/1000; }
    if (s.type==='velo')   veloMin+=min;
    if (s.type==='cardio') cardioMin+=min;
    if (s.type==='muscu')  muscu++;
  }));

  const bar = document.getElementById('statsBar');
  bar.innerHTML =
    '<div class="stat-item"><div class="stat-val">'+total+'</div><div class="stat-lbl">Séances</div></div>'+
    '<div class="stat-item"><div class="stat-val">'+fmtTime(totalMin)+'</div><div class="stat-lbl">Temps total</div></div>'+
    (runKm>0 ? '<div class="stat-item"><div class="stat-val">'+runKm.toFixed(1)+'km</div><div class="stat-lbl">Course · '+fmtTime(runMin)+'</div></div>' : '')+
    (swimKm>0 ? '<div class="stat-item"><div class="stat-val">'+swimKm.toFixed(1)+'km</div><div class="stat-lbl">Nage · '+fmtTime(swimMin)+'</div></div>' : '')+
    (veloMin>0 ? '<div class="stat-item"><div class="stat-val">'+fmtTime(veloMin)+'</div><div class="stat-lbl">Vélo</div></div>' : '')+
    (cardioMin>0 ? '<div class="stat-item"><div class="stat-val">'+fmtTime(cardioMin)+'</div><div class="stat-lbl">Cardio</div></div>' : '')+
    (muscu>0 ? '<div class="stat-item"><div class="stat-val">'+muscu+'</div><div class="stat-lbl">Séances muscu</div></div>' : '');

  // Calendar
  const cal = document.getElementById('calendar');
  cal.innerHTML = '';

  DAY_NAMES.forEach((name, i) => {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    const isToday = d.getTime() === today.getTime();
    const race = RACES[i];
    const sessions = PLAN[i] || [];

    const col = document.createElement('div');
    col.className = 'day-col' + (isToday ? ' is-today' : '') + (race ? ' is-race' : '');

    col.innerHTML = '<div class="day-head"><div class="day-name">'+name+'</div><div class="day-date">'+formatDate(d)+'</div></div>';

    if (race) {
      col.innerHTML += '<div class="race-slot"><div class="race-icon">🏁</div><div class="race-name">'+race.name+'</div><div class="race-info">'+race.info.replace(/\n/g,'<br>')+'</div></div>';
    }

    if (sessions.length === 0 && !race) {
      col.innerHTML += '<div class="empty-day">Repos</div>';
    }

    sessions.forEach(s => {
      const color = TYPE_COLORS[s.type] || 'var(--muted2)';
      const label = TYPE_LABELS[s.type] || s.type;
      col.innerHTML +=
        '<div class="session" style="--c:'+color+'">'+
          '<div class="session-type">'+label+'</div>'+
          '<div class="session-title">'+s.title+'</div>'+
          (s.detail ? '<div class="session-detail">'+s.detail.replace(/\n/g,'<br>')+'</div>' : '')+
          '<div class="session-meta">'+
            (s.duration ? '<span class="session-tag">⏱ '+s.duration+'</span>' : '')+
            (s.volume   ? '<span class="session-tag">📏 '+s.volume+'</span>' : '')+
          '</div>'+
        '</div>';
    });

    cal.appendChild(col);
  });
}

render();
</script>
</body>
</html>
